# Mantiene activos los proyectos gratuitos de Supabase: los pausa si muestran poca actividad en 7 días
# ("unas pocas peticiones diarias" bastan, según su documentación). Corre DOS VECES AL DÍA, todos los días
# (6:17 a. m. y 6:17 p. m. hora de Colombia; minuto :17 para evitar la congestión de GitHub a la hora en punto),
# y hace una consulta mínima de SOLO LECTURA con el rol ewb_tablero (no puede modificar nada).
# No lee datos de docentes: solo cuenta tablas. Reintenta hasta 3 veces si hay un fallo pasajero de red.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   TABLERO_STAGING_USER, TABLERO_STAGING_PASS, TABLERO_PROD_USER, TABLERO_PROD_PASS

name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días 11:17 UTC = 6:17 a. m. Colombia (UTC-5)
    - cron: "17 23 * * *"   # todos los días 23:17 UTC = 6:17 p. m. Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latido:
    name: Latido ${{ matrix.proyecto }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - proyecto: ewb-entorno-staging
            secreto_usuario: TABLERO_STAGING_USER
            secreto_clave: TABLERO_STAGING_PASS
          - proyecto: ewb-entorno-prod
            secreto_usuario: TABLERO_PROD_USER
            secreto_clave: TABLERO_PROD_PASS
    steps:
      - name: Consulta mínima de solo lectura
        env:
          PGHOST: aws-0-sa-east-1.pooler.supabase.com
          PGPORT: "5432"
          PGDATABASE: postgres
          PGSSLMODE: require
          PGUSER: ${{ secrets[matrix.secreto_usuario] }}
          PGPASSWORD: ${{ secrets[matrix.secreto_clave] }}
        run: |
          for intento in 1 2 3; do
            if n=$(docker run --rm -e PGHOST -e PGPORT -e PGDATABASE -e PGSSLMODE -e PGUSER -e PGPASSWORD \
                postgres:17 psql -v ON_ERROR_STOP=1 -tAc \
                "select count(*) from information_schema.tables where table_schema = 'public'"); then
              echo "::notice::${{ matrix.proyecto }} activo (tablas visibles en public: $n, intento $intento)"
              exit 0
            fi
            echo "Intento $intento falló; se reintenta en 30 s"
            sleep 30
          done
          echo "::error::${{ matrix.proyecto }}: la consulta falló 3 veces"
          exit 1

name: 'tracking_ewb_ia'
version: '1.0.0'
config-version: 2

profile: 'tracking_ewb_ia'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  tracking_ewb_ia:
    staging:
      materialized: view
      schema: staging
    marts:
      materialized: table
      schema: marts
    diamond:
      materialized: table
      schema: public
      # RLS + lectura solo para el rol ewb_tablero (no hace nada si el rol no existe)
      +post-hook: "{{ permitir_lectura_tablero() }}"
    

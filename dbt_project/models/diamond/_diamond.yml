version: 2

# Pruebas de calidad de las tablas finales que consume el tablero.
# Si fallan, dbt reporta solo la CANTIDAD de filas con problema, nunca sus valores.

models:
  - name: consolidado_historico
    columns:
      - name: anio_lectivo
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2023, 2024, 2025, 2026]
                quote: false

  - name: trazabilidad_historica
    columns:
      - name: docente_id
        data_tests: [unique, not_null]

  # Entregable SED · versión ancha: una fila por persona
  - name: sed_entregable_ancho
    columns:
      - name: numero_documento
        data_tests: [unique, not_null]
      - name: "no"
        data_tests: [unique, not_null]
      - name: estado_finalizacion_2025
        data_tests:
          - accepted_values:
              arguments:
                values: ['Aprobado', 'Sin constancia', 'Retirado', 'Sin registro', 'No aplica']

  # Entregable SED · versión larga: una fila por participación (mismas filas que consolidado_historico)
  - name: sed_entregable_largo
    columns:
      - name: "no"
        data_tests: [unique, not_null]
      - name: anio
        data_tests: [not_null]
      - name: estado_finalizacion
        data_tests:
          - accepted_values:
              arguments:
                values: ['Aprobado', 'Sin constancia', 'Retirado', 'Sin registro']

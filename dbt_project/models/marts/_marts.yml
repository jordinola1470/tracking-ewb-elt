version: 2

# Pruebas de calidad de datos de la capa Gold (marts).
# Si fallan, dbt reporta solo la CANTIDAD de filas con problema, nunca sus valores.

models:
  - name: dim_docentes
    columns:
      - name: docente_id
        data_tests: [unique, not_null]

  - name: dim_ied
    columns:
      - name: codigo_dane
        data_tests: [unique, not_null]

  - name: dim_curso
    columns:
      - name: grupo_id
        data_tests: [unique, not_null]

  - name: dim_mcer
    columns:
      - name: mcer_id
        data_tests: [unique, not_null]
      - name: nivel_mcer
        data_tests: [unique, not_null]

  - name: fct_docentes
    columns:
      - name: docente_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_docentes')
                field: docente_id
      - name: anio_lectivo
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2023, 2024, 2025, 2026]
                quote: false

  # Nivel del curso del que se retiró cada docente (helpdesk): una fila por docente y año
  - name: fct_helpdesk_retiros
    data_tests:
      - unique:
          column_name: "docente_id || '-' || anio_lectivo"
    columns:
      - name: docente_id
        data_tests: [not_null]
      - name: nivel_retiro
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PRE_A1', 'A1', 'A1+', 'A2', 'A2+', 'B1', 'B1+', 'B2', 'B2+', 'C1', 'C1+']

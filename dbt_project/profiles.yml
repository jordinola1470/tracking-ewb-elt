tracking_ewb_ia:
  target: dev
  outputs:
    dev:
      type: postgres
      threads: 4
      host: "{{ env_var('DB_HOST') }}"
      port: "{{ env_var('DB_PORT') | as_number }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASS') }}"
      dbname: "{{ env_var('DB_NAME') }}"
      # 'prefer' en local/Docker; 'require' en Supabase
      sslmode: "{{ env_var('DB_SSLMODE', 'prefer') }}"
      schema: public

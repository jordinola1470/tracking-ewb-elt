tracking_ewb_ia:
  target: dev
  outputs:
    dev:
      type: postgres
      threads: 4
      # `| trim` quita espacios y saltos de línea sobrantes (ej. un Enter pegado en un secreto de GitHub)
      host: "{{ env_var('DB_HOST') | trim }}"
      port: "{{ env_var('DB_PORT') | trim | as_number }}"
      user: "{{ env_var('DB_USER') | trim }}"
      password: "{{ env_var('DB_PASS') | trim }}"
      dbname: "{{ env_var('DB_NAME') | trim }}"
      # 'prefer' en local/Docker; 'require' en Supabase
      sslmode: "{{ env_var('DB_SSLMODE', 'prefer') | trim }}"
      schema: public

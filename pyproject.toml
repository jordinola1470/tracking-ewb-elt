[project]
name = "tracking-ewb-elt"
version = "0.5.0"
description = "Pipeline ELT (Python + dbt + PostgreSQL) de seguimiento docente del programa English without Borders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.11.4",
    "dbt-postgres>=1.10.0",
    "dotenv>=0.9.9",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pandas<3",
    "pathlib>=1.0.1",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.46",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integracion: requiere una base de datos encendida",
    "e2e: verifica el pipeline completo sobre la base cargada con Excel ficticios (EWB_E2E=1)",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


[tool.ruff]
target-version = "py311"
extend-exclude = ["tests/append.ipynb"]

[tool.ruff.lint]
# Modo básico: solo errores reales (sintaxis, nombres no definidos, imports o variables sin usar)
select = ["E9", "F"]
